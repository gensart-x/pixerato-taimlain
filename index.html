<!doctype html>

<html class="dark" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link
            crossorigin=""
            href="https://fonts.gstatic.com"
            rel="preconnect"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Press+Start+2P&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <style>
            @layer base {
                html,
                body {
                    margin: 0;
                    padding: 0;
                }
                body {
                    overscroll-behavior: none;
                }
            }
            ::-webkit-scrollbar {
                display: none;
            }
            .scanline-fx {
                background:
                    linear-gradient(
                        rgba(18, 16, 16, 0) 50%,
                        rgba(0, 0, 0, 0.25) 50%
                    ),
                    linear-gradient(
                        90deg,
                        rgba(255, 0, 0, 0.03),
                        rgba(0, 255, 0, 0.01),
                        rgba(0, 0, 255, 0.03)
                    );
                background-size:
                    100% 3px,
                    6px 100%;
                pointer-events: none;
            }
            .pixel-grid {
                background-image: radial-gradient(
                    rgba(0, 232, 216, 0.06) 1px,
                    transparent 0
                );
                background-size: 20px 20px;
            }
            .pixel-art {
                width: 128px;
                height: 128px;
                image-rendering: pixelated;
            }
        </style>
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            background: "#0D0D0D",
                            "surface-container-lowest": "#000a30",
                            "surface-container-low": "#00164e",
                            "surface-container": "#001a57",
                            "surface-container-high": "#00236e",
                            "surface-container-highest": "#002c86",
                            "primary-container": "#0D0D0D",
                            "on-surface": "#dce1ff",
                            "on-surface-variant": "#c4c7c7",
                            "pixel-cyan": "#00E8D8",
                            "pixel-yellow": "#F8D800",
                            "pixel-orange": "#F87800",
                            "pixel-white": "#FCFCFC",
                            secondary: "#57e245",
                            tertiary: "#ffb2bc",
                            outline: "#8e9192",
                        },
                        fontFamily: {
                            h1: ['"Press Start 2P"'],
                            "body-md": ['"Press Start 2P"'],
                            "headline-lg": ["Space Mono"],
                            "headline-md": ["Space Mono"],
                            "headline-sm": ["Space Mono"],
                            "body-lg": ["Courier Prime"],
                            "body-sm": ["Courier Prime"],
                            "label-md": ["JetBrains Mono"],
                            "label-sm": ["JetBrains Mono"],
                        },
                    },
                },
            };
        </script>
    </head>
    <body
        class="bg-background text-on-surface font-body-sm selection:bg-pixel-cyan selection:text-background min-h-screen relative antialiased"
    >
        <!-- Subtle CRT Scanline overlay & Grid -->
        <div
            class="fixed inset-0 pixel-grid pointer-events-none opacity-40 z-0"
        ></div>
        <div class="fixed inset-0 scanline-fx z-[200]"></div>
        <!-- 1. MINIMAL RETRO-CLEAN HEADER -->
        <header
            class="fixed top-0 left-0 w-full z-[100] bg-background/95 border-b border-surface-container-high/60 backdrop-blur-sm"
        >
            <div
                class="h-16 max-w-5xl mx-auto px-6 flex items-center justify-between"
            >
                <div class="flex items-center gap-3">
                    <a
                        class="flex items-center gap-2 font-label-md text-pixel-white tracking-wider hover:text-pixel-cyan transition-colors"
                        href="#"
                    >
                        <span class="text-pixel-cyan font-bold">[■]</span>
                        <span class="font-bold">gensart</span>
                        <span
                            class="inline-block w-2 h-3.5 bg-pixel-cyan animate-pulse"
                        ></span>
                    </a>
                </div>
                <nav
                    class="flex items-center gap-6 font-label-sm text-label-sm hidden md:block"
                >
                    <!-- <a class="text-pixel-cyan font-bold tracking-wide transition-colors" href="#timeline">TIMELINE</a> -->
                    <a
                        class="text-on-surface-variant hover:text-pixel-white transition-colors tracking-wide"
                        href="https://github.com/gensart-x"
                        target="_blank"
                        >github</a
                    >
                    <a
                        class="text-on-surface-variant hover:text-pixel-white transition-colors tracking-wide"
                        href="https://gensart.qzz.io"
                        >my-web</a
                    >
                </nav>
            </div>
        </header>
        <!-- MAIN WRAPPER -->
        <main class="relative z-10 w-full pt-28 pb-24 max-w-5xl mx-auto px-6">
            <!-- Intro Headline Minimal -->
            <div class="mb-12 text-center md:text-start">
                <div
                    class="flex items-center gap-2 font-label-sm text-pixel-cyan tracking-widest uppercase mb-2 justify-center md:justify-start"
                >
                    <span>Howdy!</span>
                    <span class="text-on-surface-variant">//</span>
                    <span>Welcome to my</span>
                </div>
                <h1
                    class="font-h1 text-xl md:text-2xl text-pixel-white tracking-tight leading-snug"
                >
                    Pixel Art Learning
                    <span class="text-pixel-cyan">TIMELINE</span>
                </h1>
                <p
                    class="font-body-lg text-on-surface-variant text-base mt-2 max-w-2xl"
                >
                    a record of pixel arts i made using Aseprite.
                </p>
            </div>
            <!-- 2. STREAMLINED VERTICAL TIMELINE GALLERY -->
            <div
                class="relative pl-6 md:pl-10 space-y-8 before:content-[''] before:absolute before:left-2 md:before:left-3.5 before:top-2 before:bottom-2 before:w-[2px] before:bg-surface-container-highest"
                id="timeline"
            >
                <!-- Loader placeholder -->
                <div id="loader" class="flex items-center justify-center py-8">
                    <div
                        class="w-8 h-8 border-4 border-pixel-cyan border-t-transparent rounded-full animate-spin"
                    ></div>
                </div>
                <script>
                    // Fetch timeline data and render items
                    fetch("/timeline.json")
                        .then((r) => r.json())
                        .then((data) => {
                            const timeline =
                                document.getElementById("timeline");
                            const loader = document.getElementById("loader");
                            if (loader) loader.remove();
                            // Remove existing static items
                            const existingItems =
                                timeline.querySelectorAll(".timeline-item");
                            existingItems.forEach((item) => item.remove());
                            data.forEach((item, index) => {
                                const colors = [
                                    "pixel-cyan",
                                    "secondary",
                                    "pixel-orange",
                                    "pixel-yellow",
                                    "tertiary",
                                ];
                                const randColor =
                                    colors[
                                        Math.floor(
                                            Math.random() * colors.length,
                                        )
                                    ];
                                const article =
                                    document.createElement("article");
                                article.className =
                                    "timeline-item relative group";
                                article.dataset.index = index;
                                article.innerHTML = `
                                    <div class="absolute -left-6 md:-left-10 top-6 w-4 h-4 bg-background border-2 border-${randColor} flex items-center justify-center">
                                        <div class="w-1.5 h-1.5 bg-${randColor} group-hover:bg-pixel-yellow transition-colors"></div>
                                    </div>
                                    <div class="bg-surface-container-lowest/80 border border-${randColor} hover:border-${randColor}/80 transition-colors p-4 md:p-6 shadow-[4px_4px_0px_#000000]">
                                        <div class="flex flex-col md:flex-row gap-5 items-stretch">
                                            <div class="md:w-56 shrink-0 aspect-[4/3] bg-surface-container-high relative overflow-hidden flex items-center justify-center cursor-pointer group/art border border-surface-container-highest/60" onclick="openLightbox(${index})">
                                                ${item.imageUrl ? `<img src="${item.imageUrl}" class="w-full h-full object-contain pixel-art"/>` : item.svg}
                                            </div>
                                            <div class="flex-1 flex flex-col justify-between">
                                                <div>
                                                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2 font-label-sm text-xs">
                                                        <span class="px-2 py-0.5 bg-${randColor} text-background font-bold">${item.tags.join(" ")}</span>
                                                        <span class="text-on-surface-variant">${item.date}</span>
                                                    </div>
                                                    <h2 class="font-headline-sm text-base md:text-lg text-pixel-white font-bold group-hover:text-pixel-cyan transition-colors">
                                                        ${item.title}
                                                    </h2>
                                                    <p class="font-body-sm text-on-surface-variant text-sm mt-2 leading-relaxed">
                                                        ${item.desc}
                                                    </p>
                                                </div>
                                                <div class="flex items-center justify-between pt-4 mt-2 border-t border-surface-container-high/40">
                                                    <div class="flex items-center gap-2 font-label-sm text-xs text-outline">
                                                        ${item.tags.map((tag) => `<span>${tag}</span>`).join("")}
                                                    </div>
                                                    <button class="font-label-sm text-xs text-${randColor} hover:text-pixel-yellow transition-colors flex items-center gap-1 px-2 py-1 border border-${randColor}/40 hover:border-pixel-yellow" onclick="openLightbox(${index})">
                                                        <span>VIEW</span>
                                                        <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>`;
                                timeline.appendChild(article);
                            });
                            // Store loaded data for lightbox usage
                            window.timelineData = data;
                        })
                        .catch((err) => {
                            console.error("Failed to load timeline data", err);
                            const loader = document.getElementById("loader");
                            if (loader)
                                loader.textContent = "Failed to load data";
                        });
                </script>
            </div>
        </main>
        <!-- RETRO FULL-SCREEN LIGHTBOX MODAL -->
        <div
            aria-modal="true"
            class="fixed inset-0 z-[300] bg-background/95 backdrop-blur-md hidden flex-col items-center justify-center p-4 sm:p-8"
            id="lightbox"
            role="dialog"
        >
            <!-- Close & Top Bar -->
            <div
                class="w-full max-w-4xl flex items-center justify-between pb-3 mb-3 border-b border-surface-container-high"
            >
                <div
                    class="flex items-center gap-2 font-label-sm text-xs text-pixel-cyan"
                >
                    <span class="w-2 h-2 bg-pixel-cyan inline-block"></span>
                    <span id="lb-counter">ITEM 1 OF 5</span>
                </div>
                <div class="flex items-center gap-2">
                    <button
                        class="flex items-center gap-1 font-label-sm text-xs px-2 py-1 bg-surface-container text-pixel-white hover:bg-secondary hover:text-background transition-colors border border-outline/40"
                        id="lb-download"
                        onclick="downloadLightboxItem()"
                        title="Download this artwork"
                        type="button"
                    >
                        <span data-label>DOWNLOAD</span>
                        <span class="material-symbols-outlined text-[16px]"
                            >download</span
                        >
                    </button>
                    <button
                        class="flex items-center gap-1 font-label-sm text-xs px-2 py-1 bg-surface-container text-pixel-white hover:bg-tertiary hover:text-background transition-colors border border-outline/40"
                        onclick="closeLightbox()"
                        type="button"
                    >
                        <span>CLOSE [ESC]</span>
                        <span class="material-symbols-outlined text-[16px]"
                            >close</span
                        >
                    </button>
                </div>
            </div>
            <!-- Main Lightbox Display -->
            <div
                class="relative w-full max-w-4xl flex-1 flex items-center justify-center min-h-0"
            >
                <!-- Center Art Container -->
                <div
                    class="w-full max-w-2xl max-h-[60vh] aspect-video bg-surface-container-lowest border-2 border-surface-container-highest flex items-center justify-center p-6 shadow-[8px_8px_0px_#000000]"
                    id="lb-art-container"
                >
                    <!-- Dynamic artwork will be inserted here -->
                </div>
            </div>
            <!-- Bottom Caption & Info -->
            <div
                class="w-full max-w-4xl pt-3 mt-3 border-t border-surface-container-high flex flex-col sm:flex-row sm:items-center justify-between gap-2"
            >
                <div>
                    <h3
                        class="font-headline-sm text-base text-pixel-white font-bold"
                        id="lb-title"
                    >
                        Title
                    </h3>
                    <p
                        class="font-body-sm text-on-surface-variant text-xs mt-0.5"
                        id="lb-desc"
                    >
                        Description
                    </p>
                </div>
                <div
                    class="font-label-sm text-xs text-pixel-yellow self-start sm:self-auto uppercase"
                    id="lb-date"
                >
                    DATE
                </div>
            </div>
        </div>
        <!-- MINIMAL CLEAN FOOTER -->
        <footer
            class="relative z-10 w-full border-t border-surface-container-high/40 bg-background py-8"
        >
            <div
                class="max-w-5xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4 font-label-sm text-xs text-on-surface-variant"
            >
                <div class="flex items-center gap-2">
                    <span class="text-pixel-cyan font-bold">How is it?</span>
                </div>
                <div class="text-center gap-4">
                    <span class="text-secondary">
                        this page is generated by artificial model
                    </span>
                    <span class="md:hidden">and tuned some by me.</span>
                </div>
            </div>
        </footer>
        <!-- Lightbox Controller Script -->
        <script>
            let currentIndex = 0;
            const lightbox = document.getElementById("lightbox");
            const artContainer = document.getElementById("lb-art-container");
            const lbTitle = document.getElementById("lb-title");
            const lbDesc = document.getElementById("lb-desc");
            const lbDate = document.getElementById("lb-date");
            const lbCounter = document.getElementById("lb-counter");
            const lbDownload = document.getElementById("lb-download");

            function getItemData(index) {
                const data = window.timelineData || [];
                return data[index] || null;
            }

            function slugify(text) {
                return (
                    String(text || "")
                        .toLowerCase()
                        .replace(/[^a-z0-9]+/g, "-")
                        .replace(/^-+|-+$/g, "") || "artwork"
                );
            }

            function extensionFromMime(mime) {
                const type = String(mime || "").split(";")[0].trim();
                const map = {
                    "image/png": "png",
                    "image/jpeg": "jpg",
                    "image/gif": "gif",
                    "image/webp": "webp",
                    "image/svg+xml": "svg",
                    "image/avif": "avif",
                };
                return map[type] || (type.split("/")[1] || "png");
            }

            function saveBlob(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 4000);
            }

            function setDownloadState(text, disabled) {
                const label = lbDownload.querySelector("[data-label]");
                if (label) label.textContent = text;
                lbDownload.disabled = !!disabled;
            }

            function downloadLightboxItem() {
                const data = getItemData(currentIndex);
                if (!data) return;

                const base = slugify(data.title);
                const date = slugify(data.date);
                const name = date ? `${base}-${date}` : base;

                setDownloadState("SAVING...", true);

                // Inline SVG artwork -> save as a .svg file
                if (!data.imageUrl && data.svg) {
                    try {
                        const parsed = new DOMParser().parseFromString(
                            data.svg,
                            "image/svg+xml",
                        );
                        const source =
                            parsed.querySelector("parsererror") !== null
                                ? data.svg
                                : parsed.documentElement.outerHTML;
                        saveBlob(
                            new Blob([source], {
                                type: "image/svg+xml;charset=utf-8",
                            }),
                            `${name}.svg`,
                        );
                        setDownloadState("SAVED", false);
                        setTimeout(
                            () => setDownloadState("DOWNLOAD", false),
                            1600,
                        );
                    } catch (err) {
                        console.error("Failed to build SVG download", err);
                        setDownloadState("FAILED", false);
                    }
                    return;
                }

                if (!data.imageUrl) {
                    setDownloadState("NO FILE", false);
                    return;
                }

                // Remote images: pull them down as a blob so the browser
                // honours the filename instead of just navigating.
                fetch(data.imageUrl, { mode: "cors" })
                    .then((res) => res.blob())
                    .then((blob) => {
                        saveBlob(
                            blob,
                            `${name}.${extensionFromMime(blob.type)}`,
                        );
                        setDownloadState("SAVED", false);
                    })
                    .catch((err) => {
                        // CORS blocked / offline -> fall back to a new tab.
                        console.warn(
                            "Direct download blocked, opening source instead.",
                            err,
                        );
                        window.open(data.imageUrl, "_blank", "noopener");
                        setDownloadState("OPENED TAB", false);
                    })
                    .finally(() =>
                        setTimeout(
                            () => setDownloadState("DOWNLOAD", false),
                            1600,
                        ),
                    );
            }

            function renderLightboxItem(index) {
                const data = getItemData(index);
                if (!data) return;
                artContainer.innerHTML = data.imageUrl
                    ? `<img src="${data.imageUrl}" class="w-full h-full object-contain pixel-art"/>`
                    : data.svg;
                lbTitle.textContent = data.title;
                lbDesc.innerHTML = data.desc
                    ? data.desc
                    : "<em>- no description supplied -</em>";
                lbDate.textContent = data.date;
                lbCounter.textContent = `DETAILED TIMELINE`;
                setDownloadState("DOWNLOAD", false);
            }

            function openLightbox(index) {
                currentIndex = index;
                renderLightboxItem(currentIndex);
                lightbox.classList.remove("hidden");
                lightbox.classList.add("flex");
                document.body.style.overflow = "hidden";
            }

            function closeLightbox() {
                lightbox.classList.add("hidden");
                lightbox.classList.remove("flex");
                document.body.style.overflow = "";
            }

            function prevLightbox() {
                currentIndex =
                    (currentIndex - 1 + (window.timelineData || []).length) %
                    (window.timelineData || []).length;
                renderLightboxItem(currentIndex);
            }

            function nextLightbox() {
                currentIndex =
                    (currentIndex + 1) % (window.timelineData || []).length;
                renderLightboxItem(currentIndex);
            }

            // Keyboard navigation
            window.addEventListener("keydown", (e) => {
                if (lightbox.classList.contains("hidden")) return;
                if (e.key === "Escape") closeLightbox();
                if (e.key === "ArrowLeft") prevLightbox();
                if (e.key === "ArrowRight") nextLightbox();
                if (e.key.toLowerCase() === "d") downloadLightboxItem();
            });

            // Close on background backdrop click
            lightbox.addEventListener("click", (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });
        </script>
    </body>
</html>
